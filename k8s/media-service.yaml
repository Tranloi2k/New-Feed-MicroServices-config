apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: newfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: media-service
          image: ghcr.io/tranloi2k/new-feed-microservices-media-service:c9a400ea5c26b45b2777c5617538421389ea3210
          ports:
            - containerPort: 3003
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: PORT
              value: "3003"
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "192Mi"
              cpu: "50m"
            limits:
              # Uploads are buffered in memory: 4 files x 8MB per request, plus
              # the stream copy handed to Cloudinary and Node's own overhead.
              memory: "640Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: newfeed
spec:
  selector:
    app: media-service
  ports:
    - port: 3003
      targetPort: 3003