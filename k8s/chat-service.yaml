apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: newfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: migrate
          image: ghcr.io/tranloi2k/new-feed-microservices-chat-service-migrate:189cf2750ffd390fc10395e9dd43c1114ba0644a
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-chat:5432/chat_db
      containers:
        - name: chat-service
          image: ghcr.io/tranloi2k/new-feed-microservices-chat-service:189cf2750ffd390fc10395e9dd43c1114ba0644a
          ports:
            - containerPort: 3006
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3006"
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-chat:5432/chat_db
            - name: REDIS_URL
              value: redis://redis:6379
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
            - name: AUTH_SERVICE_URL
              value: http://auth-service:3001
            - name: JWT_ISSUER
              value: newfeed-auth-service
            - name: JWT_AUDIENCE
              value: newfeed-api-gateway
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3006
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: newfeed
spec:
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: chat-service
  ports:
    - port: 3006
      targetPort: 3006
