apiVersion: batch/v1
kind: CronJob
metadata:
  name: auth-session-cleanup
  namespace: newfeed
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: cleanup
              image: ghcr.io/tranloi2k/new-feed-microservices-auth-service-migrate:539b0b13c29dafd5220df4be7cbb1a5cc47613ed
              command: ["npm", "run", "sessions:cleanup"]
              envFrom:
                - secretRef:
                    name: app-secrets
              env:
                - name: NODE_ENV
                  value: production
                - name: DATABASE_URL
                  value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-auth:5432/auth_db
