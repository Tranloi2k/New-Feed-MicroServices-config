apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: newfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: migrate
          image: ghcr.io/tranloi2k/new-feed-microservices-auth-service-migrate:c4dd202feb4ebf87410a64aef3d097dab5bcbf4b
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-auth:5432/auth_db
      containers:
        - name: auth-service
          image: ghcr.io/tranloi2k/new-feed-microservices-auth-service:c4dd202feb4ebf87410a64aef3d097dab5bcbf4b
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-auth:5432/auth_db
            - name: REDIS_URL
              value: redis://redis:6379
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: newfeed
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
